apiVersion: 1

datasources:
  - name: InfluxDB_v2_Flux
    uid: influxdb_quantum_uid
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ioe413-org
      defaultBucket: streaming_quantum
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN

      